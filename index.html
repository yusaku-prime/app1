<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>家計簿</title>
<meta name="theme-color" content="#f58a07">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="家計簿">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f6f6f4;--card:#fff;--text:#222;--sub:#777;--line:#e4e4e0;--acc:#f58a07;--acc-t:#fff;--soft:#fff5e3;--exp:#e8604c;--inc:#3b8fd0;--sat:#3b8fd0;--sun:#e8604c}
@media (prefers-color-scheme:dark){:root{--bg:#141414;--card:#1f1f1f;--text:#ececec;--sub:#9a9a9a;--line:#333;--acc:#ff9a1f;--acc-t:#1a1100;--soft:#2e2412;--exp:#f2796a;--inc:#62aee8;--sat:#62aee8;--sun:#f2796a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;overscroll-behavior:none}
html{-webkit-text-size-adjust:100%}
main{touch-action:pan-y;will-change:transform}
/* 縦画面のみ: 横向きでは操作を止めて案内を出す */
@media (orientation:landscape) and (max-height:500px){body>*{display:none!important}body::before{content:"縦向きでお使いください";display:block;text-align:center;padding:30vh 16px 0;color:var(--sub);font-size:18px}}
body{padding:env(safe-area-inset-top) 0 calc(64px + env(safe-area-inset-bottom))}
main{max-width:640px;margin:0 auto}
h2{font-size:14px;margin:18px 16px 6px;color:var(--sub);font-weight:600}
button,.btn{font:inherit;min-height:44px;min-width:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:0 14px}
.primary{background:var(--acc);color:var(--acc-t);border-color:var(--acc);font-weight:700}
.big{width:calc(100% - 32px);margin:16px;min-height:52px;border-radius:26px;font-size:18px}
.danger{color:var(--exp)}
.exp{color:var(--exp)}.inc{color:var(--inc)}
.top{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--line);min-height:56px;gap:8px}
.top b{font-size:17px}
.ibtn{border:0;background:none;font-size:22px;color:var(--acc);padding:0}
.seg{display:inline-flex;background:var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:none;min-height:34px;border-radius:8px;padding:0 12px;font-weight:600;color:var(--text);white-space:nowrap}
.seg button.on{background:var(--acc);color:var(--acc-t)}
.top .seg{margin:0 auto}
.mnav{display:flex;align-items:center;gap:6px;padding:10px 12px;background:var(--card)}
.mnav .cur{flex:1;text-align:center;background:var(--soft);border-radius:10px;min-height:44px;line-height:44px;font-weight:700;font-size:18px}
.mnav button{border:0;background:none;font-size:22px;color:var(--sub)}
.boxes{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 12px;background:var(--card)}
.box{border:1px solid var(--line);border-radius:10px;padding:8px 12px;display:flex;justify-content:space-between;align-items:center}
.box.w{grid-column:1/3}.box small{color:var(--sub);font-size:13px}.box b{font-size:19px}
.sub3{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;padding:10px 0;background:var(--card);border-top:1px solid var(--line)}
.sub3 small{display:block;color:var(--sub);font-size:13px}.sub3 b{font-size:20px}
/* 入力フォーム */
form .frow{display:flex;align-items:center;gap:8px;padding:6px 16px;background:var(--card);border-bottom:1px solid var(--line);min-height:54px}
.fl{width:56px;font-weight:700;font-size:15px;flex:none}
.fl.hd{width:auto;padding:14px 16px 4px;display:block;background:none}
input,select{font:inherit;width:100%;min-height:42px;border:1px solid transparent;border-radius:10px;padding:0 10px;background:var(--bg);color:var(--text)}
input.amt{font-size:22px;font-weight:700;background:var(--soft)}
input[type=date]{text-align:center;background:var(--soft);font-weight:700;flex:1;min-width:0}
.step{border:0;background:none;font-size:22px;color:var(--sub);padding:0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px 16px}
.cat{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:64px;padding:6px 2px;font-size:13px;background:var(--card);border-radius:8px;gap:2px}
.cat .e{font-size:24px;line-height:1.1}
.cat.on{border:2px solid var(--acc);background:var(--soft)}
.chk{display:flex;align-items:center;gap:10px;margin:12px 16px;font-size:15px}
.chk input{width:22px;min-height:22px}
/* 一覧 */
.list{background:var(--card)}
.dh{display:flex;justify-content:space-between;padding:6px 16px;background:var(--bg);color:var(--sub);font-size:14px;font-weight:600}
.tx{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);border-radius:0;background:var(--card);padding:8px 16px;min-height:58px}
.tx .l{flex:1;min-width:0}.tx .l div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .l small{color:var(--sub)}
.tx .r{white-space:nowrap;font-weight:700;font-size:17px}
.ic{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;font-size:19px;flex:none}
.empty{text-align:center;color:var(--sub);padding:24px 0}
.card{background:var(--card);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 16px}
.muted{color:var(--sub);font-size:14px}
.row{display:flex;gap:8px}.row>*{flex:1}
/* カレンダー */
.cal{display:grid;grid-template-columns:repeat(7,1fr);background:var(--card)}
.cal .wd{text-align:center;font-size:13px;background:var(--line);padding:4px 0}
.cal .day{display:flex;flex-direction:column;justify-content:space-between;align-items:stretch;min-height:56px;padding:2px 3px;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);border-radius:0;background:var(--card);text-align:left;min-width:0}
.cal .day .n{font-size:14px}.cal .day .v{font-size:10.5px;text-align:right;line-height:1.2}
.cal .day.out{background:var(--bg);color:var(--sub)}
.cal .day.sel{outline:2px solid var(--acc);outline-offset:-2px;background:var(--soft)}
.sat{color:var(--sat)}.sun{color:var(--sun)}
/* レポート */
.donut{display:block;width:300px;height:300px;max-width:100%;margin:8px auto}
.donut text{fill:var(--text)}
.donut text.lb{fill:#fff;stroke:rgba(0,0,0,.6);stroke-width:.45;paint-order:stroke;pointer-events:none}
.donut circle{-webkit-tap-highlight-color:transparent}
.sh{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:1;min-height:52px}
.sh b{flex:1;font-size:17px}
.rrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);border-radius:0;background:var(--card);padding:6px 16px;min-height:56px}
.rrow .nm{flex:1;font-weight:700}.rrow .am{font-weight:700;font-size:17px}.rrow .pc{color:var(--sub);font-size:13px;width:48px;text-align:right}
.rrow.on{background:var(--soft)}
.bar{height:6px;border-radius:3px;background:var(--line);margin-top:4px}.bar i{display:block;height:100%;border-radius:3px}
.brow{padding:8px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.brow .h{display:flex;align-items:center;gap:10px}.brow .nm{flex:1;font-weight:700}
.brow input{width:110px;text-align:right}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:3}
nav button{flex:1;border:0;border-radius:0;background:none;color:var(--sub);min-height:56px;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;gap:0;line-height:1.3}
nav button span{font-size:20px;filter:grayscale(1);opacity:.7}
nav button.on{color:var(--acc);font-weight:700}
nav button.on span{filter:none;opacity:1}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:5}
#sheet[hidden]{display:none}
#sheet .in{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:0 0 calc(24px + env(safe-area-inset-bottom))}
#sheet .in>h3{margin:0;padding:14px 16px;background:var(--card);font-size:16px}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:9;max-width:90%}
#toast[hidden]{display:none}
.emo{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;padding:8px 16px}
.emo button{font-size:22px;padding:0}.emo button.on{border:2px solid var(--acc);background:var(--soft)}
</style>
</head>
<body>
<main id="main"></main>
<nav id="tabs">
  <button data-act="tab" data-v="input"><span>✏️</span>入力</button>
  <button data-act="tab" data-v="cal"><span>📅</span>カレンダー</button>
  <button data-act="tab" data-v="report"><span>📊</span>レポート</button>
  <button data-act="tab" data-v="menu"><span>⋯</span>メニュー</button>
</nav>
<div id="sheet" hidden></div>
<div id="toast" hidden></div>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
