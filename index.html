<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>家計簿</title>
<meta name="theme-color" content="#1f7a5a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="家計簿">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f4f6f5;--card:#fff;--text:#1d2a25;--sub:#66756e;--line:#e1e7e4;--acc:#1f7a5a;--acc-t:#fff;--exp:#c2410c;--inc:#1f7a5a;--bar:#7fc4a8}
@media (prefers-color-scheme:dark){:root{--bg:#121816;--card:#1c2421;--text:#e6efeb;--sub:#8fa39a;--line:#2b3631;--acc:#3fb68a;--acc-t:#06231a;--exp:#fb923c;--inc:#3fb68a;--bar:#2f7d62}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
body{padding:calc(env(safe-area-inset-top) + 8px) 16px calc(76px + env(safe-area-inset-bottom))}
main{max-width:640px;margin:0 auto}
h2{font-size:15px;margin:20px 0 8px;color:var(--sub);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.mnav{display:flex;align-items:center;justify-content:space-between;margin:6px 0 12px}
.mnav b{font-size:20px}
button,.btn{font:inherit;min-height:44px;min-width:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:0 14px}
.primary{background:var(--acc);color:var(--acc-t);border-color:var(--acc);font-weight:600}
.danger{color:var(--exp)}
.sums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sums div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center}
.sums small{display:block;color:var(--sub);font-size:12px}
.sums b{font-size:16px}
.exp{color:var(--exp)}.inc{color:var(--inc)}
.trend{display:flex;align-items:flex-end;gap:4px;height:90px}
.trend button{flex:1;min-width:0;padding:0;border:0;background:none;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:10px;color:var(--sub)}
.trend i{display:block;width:100%;background:var(--bar);border-radius:4px 4px 0 0;min-height:2px}
.trend .on i{background:var(--acc)}
.trend .on{color:var(--text);font-weight:700}
.crow{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 0;min-height:44px}
.crow .t{display:flex;justify-content:space-between}
.crow .b{height:6px;border-radius:3px;background:var(--line);margin-top:4px}
.crow .b i{display:block;height:100%;border-radius:3px;background:var(--acc)}
.crow.on .t span:first-child{font-weight:700;color:var(--acc)}
.tx{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;border:0;border-top:1px solid var(--line);border-radius:0;background:none;padding:10px 0;min-height:56px}
.tx:first-child{border-top:0}
.tx .l{min-width:0}.tx .l div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx small{color:var(--sub)}
.tx .r{white-space:nowrap;font-weight:600}
.chip{display:inline-block;background:var(--line);border-radius:10px;padding:0 8px;font-size:12px;color:var(--sub);margin-left:6px}
label{display:block;font-size:13px;color:var(--sub);margin:12px 0 4px}
input,select{font:inherit;width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:var(--bg);color:var(--text)}
.row{display:flex;gap:8px}.row>*{flex:1}
.chk{display:flex;align-items:center;gap:10px;margin:14px 0;color:var(--text);font-size:15px}
.chk input{width:22px;min-height:22px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;border-radius:0;background:none;color:var(--sub);min-height:56px;font-size:13px}
nav button.on{color:var(--acc);font-weight:700}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:5}
#sheet[hidden]{display:none}
#sheet .in{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:9;max-width:90%}
#toast[hidden]{display:none}
.muted{color:var(--sub);font-size:14px}
.empty{text-align:center;color:var(--sub);padding:24px 0}
</style>
</head>
<body>
<main id="main"></main>
<nav id="tabs">
  <button data-act="tab" data-v="month">月別</button>
  <button data-act="tab" data-v="add">追加</button>
  <button data-act="tab" data-v="import">取込</button>
  <button data-act="tab" data-v="settings">設定</button>
</nav>
<div id="sheet" hidden></div>
<div id="toast" hidden></div>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
